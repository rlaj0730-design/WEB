<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    주석 사용법: ctr + /
    문서 형식 불러오기: ! + enter
    Live server 실행: 마우스 우클릭 -> Open With LiveServer 클릭
    단축키 => ALT + L + O 
    위에꺼 복사: ALT + SHIFT +방향키(아래)
    다중 커서 설정: Alt + 원하는 위치 클릭
    -->

    <!-- 1. 제목 태그(h1~h6) : 숫자가 작을 수록 크기가 커짐-->
     <h1>제목 태그 h1</h1>
     <h2>제목 태그 h2</h2>
     <h3>제목 태그 h3</h3>
     <h4>제목 태그 h4</h4>
     <h5>제목 태그 h5</h5>
     <h6>제목 태그 h6</h6>

     <!-- 2. 본문 태그 (p/span) 
      p태그: 단락으로 표현 => 가로 한줄 영역 전부 차지 => 개행이 된 것처럼 보임
      span태그: 문장으로 표현  => 입력한만큼 영역 차지 => 가로로 이어서 배치
     -->
      
      <p>p태그</p>
      <p>p태그</p>
      <span>span태그</span>
      <span>span태그</span>

      <!-- 
      hr/br태그
      br => 개행 태그 
      hr => 수평선을 그어주는 태그 
      -->

      <p>본문 태그1</p>
      <p>본문 태그2</p>
      <span>본문 태그3</span>
      <br>
      <span>본문 태그4</span>

      <hr color="green" width="150" size = "140"> 



    


</body>
</html>
