<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- form태그 속성들
        method : 전달방식(get, post)
            get : 주소창(url)에 내용을 담아 정달 -> 긴글 형태x, 주소창에 정보 노출이 될 수 있음
            post : 주소창(url)에 내용을 담지 않고 전달 -> 긴글 형태o, 주소창에 정보 노출x -> 로그인, 회원가입, 대용량 데이터를 다룰 때

        action : 전달위치 
    -->
    <form>
        <h4>입력</h4>

        <!-- 
            input태그 : 사용자에게 입력을 받을 수 있는 태그(공간)
            (1) name 속성 : 입력한 값을 구분하기 위해 이름을 지정
            (2) placeholder 속성 : 입력공간에 안내문구를 표시
            (3) autofocus 속성 : 페이지가 열리면 자동으로 입력공간에 커서가 깜빡이게 함
            (4) maxlength 속성 : 입력할 수 있는 글자수를 제한
            (5) value 속성 : 입력공간에 기본값을 지정   
            (6) readonly 속성 : 입력공간에 입력을 못하게 막음
        -->
        ID <input
        type="text"
        name="id"
        placeholder="아이디를 입력하세요"
        autofocus
        >

        PW <input
        type="password"
        name="pw"
        maxlength="10"
        >

        주소 <input
        type="text"
        name="address"
        value="광주"
        readonly
        >

        <h4>선택</h4>

        <!-- checkbox와 radio의 속성
            name : 어떤 설문인지?
            value : 설문에 대한 값
         -->
        <!-- 중복선택 가능 -->
         <p>좋아하는 음료를 모두 골라주세요.</p>
         아메리카노 <input type="checkbox" name="menu" value="ia">
         포도에이드 <input type="checkbox" name="menu" value="ga">

         <!-- 중복선택 불가능 -->
          <p>성별을 골라주세요.</p>
          남성 <input type="radio" name="gender" value="man">
          여성 <input type="radio" name="gender" value="woman">

          <br><br>
          <!-- select 태그
            -> option 태그와 함께 사용 
          -->

          <select>
                <option>A형</option>
                <option>B형</option>
                <option>O형</option>
                <option>AB형</option>
          </select>

          <br><br>

          게시물 입력
          <br>
          <!-- textarea 태그 : 여러 줄의 텍스트를 입력할 수 있는 공간
            cols : 텍스트 영역의 가로 너비를 문자단위로 지정
            rows : 텍스트 영역의 세로 높이를 줄 단위로 지정 
          -->
          <textarea cols="30" rows="5">

          </textarea>

          <h4>그 외 종류</h4>
          <br>
          <input type="color">
          <br>
          <input type="file">
          <br>
          <input type="date">
          <!-- 
            제출 및 초기화되는 정보는 form태그 안 시작~ 끝 데이터만 된다
            제출 및 초기화 위치 -> form태그 안에 있어야 한다
          -->
          <h4>제출 및 초기화</h4>
          <input type="submit" value="전송하기">
          <input type="reset" value="초기화">
    </form>
</body>
</html>
