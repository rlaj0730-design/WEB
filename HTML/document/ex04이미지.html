<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 이미지태그
        필수 속성 : src 
    -->
    <!-- 외부주소 값 적용 -->
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTK5_x9qRCVmfNMuK8IEf_4Rw5PWhuN1Iu4wKxg0a-rwA&s=10">

     ../ : 상위 경로로 접근
     / : 최상위로 접근
    -->
     <img src="../img/images.jpg" width="500px">
