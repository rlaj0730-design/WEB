<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 
    강조태그
    (1) b태그: 글자를 굵게. => 시각적 의미 강조
    (2) strong태그: 글자를 굵게. => 실질적 의미 강조

    -->
    <span>본문내용 확인</span>
    <b>강조내용 확인</b>

    <br>

    <span>본문내용 확인</span>
    <strong>strong태그</strong>

    <!-- (3) 배경색 적용 -->
     <br>
     <span>여기 부분을</span>
     <mark>강조를 하겠습니다.</mark>


    <!-- (4) 위첨자와 아래첨자 
    위첨자: sup
    아래첨자: sub
    대칭구조: 태그 안에 태그를 넣는 상태 
    -->
     <p>
        이번 강조내용은<sup>위첨자</sup>
     </p>

     <p>
        두번째 강조내용은<sub>아래첨자</sub>
    </p>






</body>
</html>
