<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 리스트 태그: ul, ol 
        ul, ol (형식) => 두 태그 모두 li 태그가 필요하다
        li => 리스트 내 실질적인 데이터
    -->

    <!-- (1) ul: 정돈되지 않은 리스트 
        type : disc(기본값), circle(원형), square(사각형) 
    -->

     <ul type="square">
        <li>html</li>
        <li>css</li>
        <li>javascript</li>
     </ul>

    <!-- (2) ol: 정돈된 리스트
        type : 1(기본값), a(소문자 알파벳), A(대문자 알파벳), i(소문자 로마 숫자), I(대문자 로마 숫자)
    -->

     <ol type = "a">
        <li>등원하기</li>
        <li>QR찍기</li>
        <li>수업듣기</li>
     </ol>
</body>
</html>
