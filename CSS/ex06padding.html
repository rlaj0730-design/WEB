<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 100px;
            height: 100px;
        }

        #box {
            background-color: yellow;
            border: solid 20px black;
            /* 
                값 적용은 마진과 동일하다 -> 원하는 위치 지정 가능하다
            */
            /* padding: 50px 20px 30px 25px; */
            padding-right: 50px;
        }
        /* 실습 */

        #box1 {
            background-color: pink;
        }

        #box2 {
            background-color: skyblue;
            padding-right: 100px;
        }

        #box3 {
            background-color: lightgreen;
            padding-right: 200px;
        }

        #box4 {
            background-color: lightyellow;
            padding-right: 300px;
        }

        #box5 {
            background-color: green;
            border-width: 3px;
            border-color: aqua;
            border-style: dotted;
            /* border: 3px aqua dotted; */

            /* border-top-left-radius: 50px;
            border-bottom-right-radius: 50px; */
            border-radius: 50px;
        }

    </style>
</head>
<body>
    <div id="box">내용</div>

    <h2>실습 div</h2>

    <div id="box1"></div>
    <div id="box2"></div>
    <div id="box3"></div>
    <div id="box4"></div>
    <br>
    <div id="box5"></div>
</body>
</html>
