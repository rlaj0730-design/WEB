<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
            부모 div요소 => 너비 120px, 높이 => 360px, 배경색 => 검정색
            경계선 둥글게 만들기 => 수치 넣어보면서 확인
            여백이 필요 (경계선 기준으로 확인)

            box-sizing => 내가 설정한 너비 == 내용+보더+패딩 모든 값들이 더해진 수치

            자식 div => 너비 100px, 높이 100px, 경계선 둥글게 만들기
            배경색 지정 필요, 여백이 필요 (경계선 기준으로 확인)
        */

        #black {
            width: 120px;
            height: 360px;
            background-color: black;
            border-radius: 20px;
            padding: 10px 0px 10px 0px ;
            box-sizing: border-box;
        }


        #red {
            width: 100px;
            height: 100px;
            background-color: red;
            border-radius: 50px;
            margin: 10px;
            
            
        }

        #yellow {
            width: 100px;
            height: 100px;
            background-color: yellow;
            border-radius: 50px;
            margin: 10px;
            
        }

        #green {
            width: 100px;
            height: 100px;
            background-color: green;
            border-radius: 50px;
            margin: 10px;
        }

         /*  선생님 풀이
        #black {
            width: 120px;
            height: 360px;
            background-color: black; 
            border-radius: 20px;
            padding: 10px;
            box-sizing: boder-box; 
        }
        
        
        
        div>div {
            width: 100px;
            height: 100px;
            border-radius: 50px;
        } 
            
        #red {
            background-color: red;
            margin-top: 10px;
        }

        #yellow {
            background-color: yellow;
            margin-top: 10px;
        }

        #green {
            background-color: green;
            margin-top: 10px;
        }
        
        
        
        */
    </style>
</head>
<body>
    <div id="black">
        <div id="red"></div>
        <div id="yellow"></div>
        <div id="green"></div>
    </div>
</body>
</html>
