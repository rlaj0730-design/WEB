<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 
            font-size : 폰트 크기, 보통 픽셀단위 많이씀
            font-weight : 폰트 굵기 -> 100~900 숫자를 사용, 700(bold)
            font-style : 폰트의 스타일을 바꾸는 속성(잘 안쓴다)
            font-family : 폰트 종류
            alt shift f : 복붙한 코드 자동 줄맞춤 단축키
        */

        p {
            font-size: 50px;
            font-weight: 200;
            font-style: oblique;
            font-family: 'DearFromsol';
        }

        @font-face {
            font-family: 'DearFromsol';
            src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2607161334@griun-fromsol-rg/griun-fromsol-rg/Griun_Fromsol-Rg.woff2') format('woff2');
            font-weight: 400;
            font-display: swap;
        }
    </style>
</head>

<body>
    <p>폰트의 속성을 살펴보고 적용해보기</p>
</body>

</html>
