<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 산술연산자 : +, -, *, /, %
        //  JS에서 '/' 기호는 계산 결과값을 출력 -> 몫을 구하려면 강제 형 변환
        let num1 = 11;
        let num2 = 5;
        console.log(num1 + num2);
        console.log(num1 - num2);
        console.log(num1 / num2);

        // 증감연산자
        // 전위, 후위 증감연산자(후위를 많이씀)
        let num = 10;
        let result =  num-- +5 + --num;
        console.log(num, result);

        // 비교연산자
        let num50 = 3;
        let num60 = 10;
        console.log(num50 > num60);

        // '==' vs '==='
        // '==' : 동등연산자(하나의 자료형이 다르더라도 같은 자료형으로 바꿔서 인식해버린다. 자동 형 변환 처리함.)
        // '===' : 일치연산자(데이터와 자료형을 모두 비교)

        // !(not) : 부정의 의미 -> !=, !==

        let num70 = 3;
        let num80 = '3';
        console.log(num70 == num80);
        console.log(num70 === num80);

        console.log(!(num70 > num80));

        // 논리 연산자 (Not연산자 !, and연산자 &&, or연산자 ||, 삼항연산자)

        // Not : 논리값 혹은 논리식 앞에 !표기 -> 기존값을 반대로 처리
        // And : 두 논리값 또는 식이 모두 true인 경우 -> 최종 값을 true로 반환
        // Or : 두 논리값 또는 식이 하나만 true인 경우에도 -> 최종 값을 true로 반환
        // 삼항연산자 => 조건식? 실행문장1 : 실행문장2
        // 조건이 참 => 실행문장1이 실행, 조건이 거짓 => 실행문장2가 실행

        let num100 = 10;
        console.log(num100 === 10? '정답입니다!' : '오답입니다!');

        // 삼항연산자를 사용해서 홀수, 짝수 판별하기 -> %(나머지를 구하는 연산기호 사용)
        let holJJack = parseInt(prompt('숫자를 입력해주세요!'));
        console.log(holJJack %2 === 0? `${holJJack}은(는) 짝수입니다.` : `${holJJack}은(는) 홀수입니다.`);
    </script>
</body>
</html>
