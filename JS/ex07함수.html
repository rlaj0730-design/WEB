<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // function키워드를 사용한 함수, 화살표 함수 두가지가 있다.
       
        // 변수에 함수를 넣어서 사용해보자

        // 함수의 선언부(로직을 실행 할 수 있는 독립된 코드블록이 생성됨)
        // 선언부에 들어가는 데이터를 매개변수라고 부른다
        function greet() {
            console.log('JS func 함수 사용')
        }

        // 함수의 호출부 (내가 만든 그리트라는 함수를 불러서 쓰겠다. 세번 호출하면 세번 불러와짐)
        // 호출부에 들어가는 데이터를 인자 or 인수 라고 부른다
        greet()
        greet()
        greet()

        // 함수 사용시 => 매개변수, 인자(인수) 데이터를 같이 넣어서 사용한다
        // 매개변수 이름은 원하는 형태로 지정이 가능하다 -> 보통은 인자와 관련된 이름으로 지정하는걸 선호한다.
        function greet_name(name) {
            console.log(`제 이름은 ${name}입니다`)
        }

        greet_name('홍길동');     //호출부에 인자('홍길동')를 넣으면 매개변수(name)에 들어가진다.

        // 매개변수, 인자 사용시 복수개(여러개로) 처리 가능
        function sum(num1, num2) {
            console.log(`${num1}와 ${num2}의 합은 : ${num1 + num2}`)
        }

        sum(4, 8)

        // 나중에 함수안에 함수가 들어가있는 콜백 구조에 대해서도 많이 배운다.
        // return키워드 활용 함수 만들기
        function sum2(num3, num4) {
            return num3 + num4
        }

        console.log(sum2(3, 10));  // 3, 10을 호출한 변수 sum2를 return에 넣어서 합치고 콘솔 로그로 나오게 했다. (함수안에 함수 넣어서 사용함)

        // 화살표 함수(스크립트 작성할때 취향을 타는데 펑션을 쓰는 사람도 있고 화살표를 쓰는 사람도 있다. 화살표가 조금 더 최신에 나온 함수.)
        // 변수에 함수를 할당 -> 화살표 키워드를 만들어서 처리  (소괄호안이 함수, 중괄호가 실행문장을 의미)
        const func2 = () => {
            console.log('화살표함수 사용');
        }
        
        func2();

        // 화살표 함수 직접 만들어보기실습 함수명은 원하는대로
        const korea = () => {
            console.log('대한민국 만세');
        }

        korea();

        // 매개변수, 인자 활용
        const korea1 = (str1, str2) => {
            console.log(`${str1}은 ${str2}!`)
        }

        korea1('대한민국', '최고')
        
        
        // 화살표 함수 변형해서 사용해 보기
        // 매개변수가 1개일 경우엔 소괄호 생략이 가능하다
        // 화살표 함수의 특장점 : {} 내 하나의 문장이고 반환해야 하는 값인 경우 -> return키워드와 {} 생략이 가능하다
        const func5 = name => `제 이름은 ${name}입니다!`
            // console.log(`제 이름은 ${name}입니다`)
            
        
        console.log(func5('홍길동'))
        
    </script>
</body>
</html>
