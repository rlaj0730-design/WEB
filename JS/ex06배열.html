<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 배열 (Array)
        // 1. 빈 배열 생성 -> []
        let array = [];

        // 2. 인덱스(인덱싱 아님)를 활용해서 데이터를 추가 -> !인덱스는 0부터 시작!
        array[0] = 1;
        array[1] = 2;

        // 3. 배열함수를 통해서 추가
        array.push(3);
        array.push(4);
        console.log(array);

        // for문을 활용해서 array내 모든 데이터 출력 -> 초기화는 인덱스 첫 번호로 지정(국룰)
        // 배열데이터를 반복처리 할 때 조건식은 배열의 길이로 설정 -> 배열 안 데이터가 추가, 삭제 될 수 있기 때문에
        for(let i=0; i<array.length; i++){     //조건식을 i<4 이렇게 해도 되는데 나중에 숫자 4를 삭제하면 오류가 날수있음. 그래서 배열의 길이를 조건식으로 많이 쓴다
            console.log(array[i]); //[i]안 넣으면 그냥 어레이[1,2,3,4]가 통째로 반복된다
        } 
        
        // 배열 내 요소 수정 -> 3을 7로 수정
        // 인덱스 활용!
        array[2] = 7;   
        console.log(array);

        // 배열 내 데이터 삭제
        // 함수를 통해서 삭제
        // pop매서드 활용시 마지막 위치의 데이터가 삭제된다. 숫자 넣으면 안됨
        array.pop();
        console.log(array);

        // 배열 내 데이터 삭제
        // splice(인덱스번호, 지정한 인덱스 위치로부터 삭제할 개수)
        let array2 = [10, 20, 30, 40, 50]; //배열데이터 만들때 직접 작성해서 넣어도 됨
        array2.splice(1, 3);
        console.log(array2);

        // 배열 함수 추가 적용해보기
        let array3 = [1, 2, 3, 4, 5];

        // 배열변수.includes(찾고싶은 요소) -> 결과값이 boolean으로 반환
        console.log(array3.includes(3));
        console.log(array3.includes(9));

        // 배열변수.indexof(인덱스 위치를 찾고 싶은 요소) -> 결과값이 해당요소가 있다면 인덱스 위치를 반환, 없다면 -1로 반환한다 -> 자바는 파이썬처럼 뒤에서 인덱스 번호를 못셈.(-1, -2)->인터프리터, 스크립트 언어의 차이때문
        console.log(array3.indexOf(2));
        console.log(array3.indexOf(10)); //없는 숫자를 넣으면 -1로 출력이 된다. 없는 인덱스로

        // 배열변수.slice(시작인덱스, 끝인덱스)
        // *끝인덱스는 -1 범위까지 출력. 파이썬처럼. 뽑고 싶은 요소의 인덱스 번호 + 1 해줘야함
        console.log(array3.slice(1,4));

        // 배열안에 객체데이터 넣어보기
        let array_object = [ { }, { }, { } ]  //이런 형태를 jason형태라고 하는데 데이터 통신에서 많이 사용한다
    </script>
</body>
</html>
