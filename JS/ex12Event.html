<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Event연결하는 방법1: 인라인방식 
        HTML요소의 이벤트속성으로 적용하는 방식
     -->
  <button onclick="show()">클릭</button>
  <br /><br />
  <p id="p_event">마우스를 올려주세요</p>
  <p id="p_event1">마우스를 올려주세요</p>
  <h4 id="h4">확인용</h4>

  <input type="text" name="input_text" id="inputTxt">
  <p id="container"></p>

  <script>
    const show = () => {             // Event연결 방법1 : 인라인 방식
        alert('클릭이벤트 발생!')
    }

    // Event연결 방법2 : 프로퍼티 방식  --->자주 사용하지 않는 방법
    // ()를 생략하고 작성해야한다
    // 동일한 이벤트 타입에 대해 여러 핸들러 등록이 불가능하다 -> 마지막에 등록된 핸들러로 처리가 된다
    // 동일한 요소에 서로 다른 이벤트 타입의 핸들러 등록 가능(온클릭 중복 x, 온클릭 온마우스 사용 o )
    const p_event = document.getElementById('p_event')

    // 별도의 함수를 정의한 후, 이벤트 속성 값으로 초기화
    const show2 = () => {
        console.log('show2 함수 실행!')
    }

    p_event.onclick = show2       // p_event랑 show2함수 조인시켜보기
    p_event.onclick = () => {
        console.log('새로운 이벤트')
    }
    p_event.onmouseover = show2

    // Event 연결 방법3 : addEventlistener() 방식 ------> 제일 많이 사용함. 파라미터 두개 넣어서 사용
    // 동일한 요소에 동일한 이벤트 타입 여러개의 핸들러 등록이 가능하다
    const p_event1 = document.getElementById('p_event1')

    p_event1.addEventListener('click', ()=>{  //클릭을 하면 함수가 실행이 된다.
        alert('add이벤트 발생')
    })

    p_event1.addEventListener('click', ()=>{
        console.log('추가 add이벤트')
    })

    p_event1.addEventListener('mouseover', ()=>{
        console.log('마우스 이벤트')
    })

    // 이벤트 객체 : 현재 요소에서 실행중인 이벤트에 대한 정보를 객체 형태로 확인 할수 있다
    // e나 event를 사용한다
    const h4 = document.getElementById('h4')

    h4.addEventListener('click', (e)=>{
        console.log(e.target.innerText)
    })

    // key이벤트 적용
    // input태그 접근
    const inputTxt = document.getElementById('inputTxt')

    // 입력공간안에 값이 변경될때마다 실행할 함수 
    inputTxt.addEventListener('keyup', ()=>{
        console.log(inputTxt.value)

        // 콘솔에 출력된 내용을 p태그에 출력
        const container = document.getElementById('container')
        // 입력요소명.value (인풋텍스트 내용)
        container.innerText = inputTxt.value
    })
  </script>
</body>
</html>
