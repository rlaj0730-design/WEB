<body>
    <h1 id="tit">
        <span>오늘 <strong>금요일</strong></span>
    </h1>

    <p id="num">0</p>
    <!-- onclick  => 이벤트 타입의 한 종류(클릭) -->
    <!-- 이벤트시 발생하는 내용들을 함수(이벤트 핸들러)로 처리 -->
    <button onclick="increase()">증가</button>
    <button onclick="decrease()">감소</button>

    <script>
        // 요소 접근
        // id값을 통해서 요소를 접근해보기
        // 접근 완료후, innerHTML, innerText 속성 사용해보기 (console에)
        let get_id = document.getElementById('tit')
        console.log(get_id.innerHTML)
        console.log(get_id.innerText)

        // 새로운값으로 변경하기
        // 텍스트 + 태그를 같이 사용해서 변경하고 싶을 때 -> innerHTML
        // get_id.innerText = '<a href="#">DOM 변경하기</a>'  --->이렇게 하면 태그랑 전부 같이 출력됨.
        get_id.innerHTML = '<a href="https://naver.com">네이버로 이동</a>'


        // 태그안에 이벤트 속성 값으로 호출 된 함수의 선언부 만들기(위에 버튼)
        const increase = () => {  //선생님 풀이
            console.log('증가~')
            // 1. 0이라는 요소를 접근하기
            // 2. 요소의 내용을 +1로 적용하여 초기화(새로운 값 씌우기)
            // 3. innerText사용
            // 4. 0이라는 요소를 접근 했으면 숫자형태로 변환
            let num =  document.getElementById('num')
            console.log(num.innerText) //num 아이디 부분 태그에서 0만 가져오려면 이너 텍스트 사용해야함
            num.innerText =  parseInt(num.innerText) + 1 //정수로 바꾸고 1 더하기를 다시 변수에 대입 
            
        }

        const decrease = () => {
            //감소 버튼도 활성화 -> 음수로 떨어지면 안됨! -> 조건이 하나 더 필요
            console.log('감소~')
            let num =  document.getElementById('num')
            
            if(parseInt(num.innerText) > 0){
                num.innerText =  parseInt(num.innerText) - 1
            }
            
                
        }
