<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // script태그 => 자바스클립트 언어를 작성할 수 있는 태그

        // 입력 - prompt('출력할내용')
        // 사용자가 키보드로 입력한 값을 문자열로 반환해주는 기능
        // prompt('이름을 입력하세요.');

        // 출력 - console.log('출력할내용')=> f12(개발자 도구창)   -> 제일 많이 쓰이는 출력문중 하나
        // console.log('오늘 JS 첫시간.');

        // console.log(prompt('이름을 입력하기~'));

        // 입력 - confirm('출력할 내용')
        // 사용자가 확인 또는 취소를 눌렀을 때, 반환 타입이 불리언형식으로 전달이 된다.(참/거짓)
        // console.log(confirm('비밀번호를 변경할까요?'));

        // 출력 - alert('출력할 내용')
        // 사용자에게 메세지를 전달
        // alert('축하드립니다~ 경품에 당첨되셨습니다.~');

        // 출력 - document.write('출력할 내용')  ----> 문서에 내용을 출력하겠다
        // HTML태그를 같이 사용할수 있다 ( <P>이런거. 원래는 사용안됨)
        // document.write('<h1>화면에 내용 출력하기!</h1>');

        // 자바스크립트에서는 변수 선언 키워드가 필요하다 => var(코드가 중복되면 값이 덧씌워져서 let을 많이 사용하게 되었다.), let(일반적 사용), const(상수라는 의미를 가지고있다. 변하면 안된다. 함수를 많이 넣음) 가 있다.
        // let num = 3   ----> 변수선언(let)과 초기화(변수에 값을 넣는 형태)가 같이 되어 있음

        // var : 변수명 재사용 가능, 변수 재할당 가능
        var num = 10;
        num = 50;
        console.log(num);

        // let : 변수명 재사용 불가능, 변수 재할당 가능
        let num1 = 30;
        num1 = 50;
        console.log(num1);

        // const : 변수명 재사용 불가능, 변수 재할당 불가능
        // const num2 = 77;
        // num2 = 79;
        // console.log(num2);

        // 입출력문 실습
        let name = prompt('이름을 입력하세요.');
        // 문자열 + 문자열 = 문자열
        // console.log('안녕하세요' + name + '님 반갑습니다.');

        // 파이썬 포맷팅 => 템플릿 리터럴
        // 전체문장은 `` 사용, 변수처리는 ${변수처리}
        console.log(`안녕하세요 ${name} 님 반갑습니다.`);

    </script>
</body>
</html>
